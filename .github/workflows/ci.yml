name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IDRIS2_VERSION: 0.8.0

jobs:
  idris-to-glsl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes chezscheme glslang-tools libgmp-dev

      - name: Restore Idris 2 compiler and API
        id: idris-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.idris2
          key: idris2-${{ runner.os }}-${{ runner.arch }}-${{ env.IDRIS2_VERSION }}-self-hosted-api-v1

      - name: Build self-hosted Idris 2 and compiler API
        if: steps.idris-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v${IDRIS2_VERSION}" \
            https://github.com/idris-lang/Idris2.git /tmp/Idris2
          make -C /tmp/Idris2 bootstrap SCHEME=chezscheme
          make -C /tmp/Idris2 install
          export PATH="$HOME/.idris2/bin:$PATH"
          make -C /tmp/Idris2 clean
          make -C /tmp/Idris2 all
          make -C /tmp/Idris2 install
          make -C /tmp/Idris2 install-api

      - name: Put Idris 2 on PATH
        run: echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"

      - name: Record compiler version
        run: idris2 --version

      - name: Run complete backend checks
        run: make check

      - name: Reject uncommitted generated output
        run: git diff --exit-code -- generated
