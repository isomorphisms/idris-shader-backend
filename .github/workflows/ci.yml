name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IDRIS2_VERSION: 0.8.0
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPLEX_PROJECTIVE_POLICY_SHA: 8e14cb50db10a055a0849e0ad7cab26454cd5791

jobs:
  idris-to-glsl:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, debian]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check out canonical complex/projective corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: isomorphisms/Idric
          ref: math/complex-projective-semantics
          path: .idric-complex
          persist-credentials: false

      - name: Check out merged receipt policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: isomorphisms/ai-ci
          ref: ${{ env.COMPLEX_PROJECTIVE_POLICY_SHA }}
          path: .ai-ci-complex-policy
          persist-credentials: false

      - name: Record exact canonical semantic head
        run: echo "IDRIC_COMPLEX_SEMANTICS_SHA=$(git -C .idric-complex rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes chezscheme glslang-tools libgmp-dev

      - name: Restore Idris 2 compiler and API
        id: idris-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.idris2
          key: idris2-${{ runner.os }}-${{ runner.arch }}-${{ env.IDRIS2_VERSION }}-self-hosted-api-v1

      - name: Build self-hosted Idris 2 and compiler API
        if: steps.idris-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v${IDRIS2_VERSION}" \
            https://github.com/idris-lang/Idris2.git /tmp/Idris2
          make -C /tmp/Idris2 bootstrap SCHEME=chezscheme
          make -C /tmp/Idris2 install
          export PATH="$HOME/.idris2/bin:$PATH"
          make -C /tmp/Idris2 clean
          make -C /tmp/Idris2 all
          make -C /tmp/Idris2 install
          make -C /tmp/Idris2 install-api

      - name: Put Idris 2 on PATH
        run: echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"

      - name: Record compiler version
        run: idris2 --version

      - name: Run complete backend checks
        run: make check

      - name: Verify follower evidence claims against merged policy
        run: python3 .ai-ci-complex-policy/complex-projective/verify_receipt.py verify build/complex-projective-follower/receipt.tsv

      - name: Reject uncommitted generated output
        run: git diff --exit-code -- generated

      - name: Retain complex/projective follower evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complex-projective-shader-follower
          path: build/complex-projective-follower
          if-no-files-found: warn
